name: Update client CDN

on:
  workflow_dispatch:
  schedule:
    # Daily at 09:17 Asia/Seoul (00:17 UTC).
    - cron: '17 0 * * *'

permissions:
  contents: write

concurrency:
  group: survev-client-cdn
  cancel-in-progress: false

jobs:
  update:
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.24.0'
      - name: Validate pipeline
        run: node --test tests/*.test.mjs
      - name: Update, build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          PUBLISH_REPOSITORY: https://github.com/${{ github.repository }}.git
          USERSCRIPT_PUBLISH_ENABLED: ${{ vars.USERSCRIPT_PUBLISH_ENABLED || 'false' }}
          GREASYFORK_SCRIPT_ID: ${{ vars.GREASYFORK_SCRIPT_ID }}
          USERSCRIPT_NAME: ${{ vars.USERSCRIPT_NAME }}
          USERSCRIPT_AUTHOR: ${{ vars.USERSCRIPT_AUTHOR }}
          USERSCRIPT_NAMESPACE: ${{ vars.USERSCRIPT_NAMESPACE }}
        run: node scripts/pipeline.mjs update
