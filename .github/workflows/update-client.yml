name: Update client CDN

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'pipeline.config.json'
      - 'client-config.hjson'
      - 'package.json'
      - '.github/workflows/update-client.yml'
  schedule:
    - cron: '3-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: survev-client-cdn
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.24.0'
      - name: Validate pipeline
        run: node --test tests/*.test.mjs
      - name: Update, build and publish
        run: node scripts/pipeline.mjs deploy
